<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Đoán Từ</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- Nút 3 gạch (Hamburger Icon) -->
<div id="hamburger" onclick="toggleMenu()">
  <span></span>
  <span></span>
  <span></span>
</div>

<!-- Bảng Menu (Panel) -->
<div id="sideMenu" class="menu-hidden">
  <div class="menu-content">
    <button class="close-btn" onclick="toggleMenu()">×</button>
    <h2>MENU</h2>
    <hr>
    <button onclick="resumeGame()">▶ Tiếp tục</button>
    <button onclick="openSettings()">⚙ Cài đặt</button>
    <button onclick="quitGame()">🚪 Thoát</button>
  </div>
</div>
<div id="gameOverModal" class="hidden">
    <h2>Trò chơi kết thúc!</h2>
    <p>Điểm của bạn: <span id="finalScore">0</span></p>
    <button onclick="resetGame()">Chơi lại</button>
</div>
<div id="modalOverlay" class="hidden" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:999;"></div>

<!-- Lớp phủ mờ nền khi mở menu -->
<div id="menuOverlay" class="hidden" onclick="toggleMenu()"></div>

<div class="card">
  <h2 id="rule"></h2>

  <div class="stats">
    <span>⏱️ <span id="time">15</span></span>
    <span>🎯 <span id="score">0</span></span>
  </div>

  <div class="bar">
    <div class="bar-inner" id="timeBar"></div>
  </div>

  <input type="text" id="inputWord" placeholder="Nhập từ..." />

  <button onclick="checkWord()">Check</button>
  <button onclick="nextRound()">Next</button>

  <p id="result"></p>
</div>

<script src="js/dictionary.js"></script>
<script src="js/banned.js"></script>
<script src="js/game.js"></script>


 </body>  
</html>
